name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Every version literal here is deliberate. The package is tools-version 6.3 with a swift-syntax floor on
# the 603 line, so 6.3.3 is the floor and 6.4.0 the current release; both are checked, and the swift-syntax
# range (603..<605) is built major by major on each. Toolchains come from swift-wire/setup-swift, a
# composite action over Swiftly, because SwiftyLab/setup-swift's tagged releases cannot install 6.4.0.
jobs:
  BuildAndTest:
    name: Linux ${{ matrix.os }} / Swift ${{ matrix.swift-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        swift-version: ["6.3.3", "6.4.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Install unzip for SwiftLint
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Build
        run: swift build -c release -Xswiftc -strict-concurrency=complete
      - name: Build tests
        # -v captures compiler invocations for SwiftLint analyze; redirected
        # to file to keep the CI log readable.
        run: swift build --build-tests -v > build.log 2>&1
      - name: Run tests
        run: swift test --skip-build
      - name: Install SwiftLint
        # SwiftLint's prebuilt Linux binary requires a GLIBC only present on 24.04+
        if: matrix.os == 'ubuntu-24.04'
        run: |
          curl -sL https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
      - name: SwiftLint unused imports
        if: matrix.os == 'ubuntu-24.04'
        run: swiftlint analyze --strict --quiet --compiler-log-path build.log
  SwiftSyntaxMatrix:
    name: swift-syntax ${{ matrix.swift-syntax-major }}.x / Swift ${{ matrix.swift-version }}
    strategy:
      fail-fast: false
      matrix:
        swift-version: ["6.3.3", "6.4.0"]
        # Every major the declared range admits (603..<605), on every supported compiler. SPM resolves to
        # the newest major on its own, so without this the floor major is never actually built; the
        # aligned pairs (603 on 6.3, 604 on 6.4) are what a real adopter gets, and the crossed pairs are
        # the promise the range makes.
        swift-syntax-major: ["603", "604"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Pin swift-syntax to ${{ matrix.swift-syntax-major }}.x
        # Narrow the declared range to a single major so SPM resolves
        # to the matrix's swift-syntax version. Targets the exact
        # range string in Package.swift; if that string changes the
        # sed needs to follow.
        run: |
          next=$((${{ matrix.swift-syntax-major }} + 1))
          sed -i 's|"603.0.0"..<"605.0.0"|"${{ matrix.swift-syntax-major }}.0.0"..<"'${next}'.0.0"|' Package.swift
          grep -q '"${{ matrix.swift-syntax-major }}.0.0"..<"'${next}'.0.0"' Package.swift
          grep swift-syntax Package.swift
      - name: Resolve dependencies
        run: swift package update
      - name: Build
        run: swift build -c release -Xswiftc -strict-concurrency=complete
      - name: Run tests
        run: swift test
  SwiftLint:
    name: SwiftLint version 3.2.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: GitHub Action for SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
  SwiftFormat:
    name: swift-format / Swift ${{ matrix.swift-version }}
    # One formatter, not the matrix: two that disagree would leave no formatting that passes.
    strategy:
      matrix:
        swift-version: ["6.4.0"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Run swift-format
        run: swift-format format --recursive --in-place .
      - name: Check for formatting differences
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code
  Coverage:
    name: Coverage / Swift ${{ matrix.swift-version }}
    # One toolchain: coverage is a measurement of the suite, not a compatibility check.
    strategy:
      matrix:
        swift-version: ["6.4.0"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Run tests with coverage
        run: swift test --enable-code-coverage --xunit-output test-results.xml
      - name: Convert to LCOV
        # 6.4's build system emits one `<Target>-test-runner` executable and a `<Target>.so` per test
        # module rather than the single `.xctest` binary earlier toolchains linked. Every one of them
        # carries instrumented code, so llvm-cov is handed all of them; the `.xctest` glob keeps the
        # older layout working should this job ever run on one.
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find .build -name 'default.profdata' -path '*/codecov/*' | head -1)
          objects=()
          for f in "$BIN_PATH"/*-test-runner "$BIN_PATH"/*.so "$BIN_PATH"/*.xctest; do
            [ -f "$f" ] && objects+=(-object "$f")
          done
          llvm-cov export \
            -format=lcov \
            -instr-profile="$PROFDATA" \
            "${objects[@]}" \
            -ignore-filename-regex=".build|Tests" \
            > coverage.lcov
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: test-results.xml
          report_type: test_results
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  APIBreakage:
    name: API Breakage / Swift ${{ matrix.swift-version }}
    strategy:
      matrix:
        swift-version: ["6.4.0"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: swift-wire/setup-swift@v1
        with:
          swift-version: ${{ matrix.swift-version }}
      - name: Check for API breaking changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift package diagnose-api-breaking-changes origin/main
